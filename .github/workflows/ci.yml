name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.12.2

      - name: Install dependencies
        run: npm ci

      - name: Build and verify package
        run: npm pack --dry-run

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.12.2

      - name: Install dependencies
        run: npm ci

      - name: Run type checks
        run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.12.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  node-24:
    name: Node 24 compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
